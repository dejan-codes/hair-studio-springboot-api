spring.application.name=hairstudio-api

spring.datasource.url=jdbc:sqlserver://YOUR_SERVER_NAME;databaseName=HairStudio;encrypt=true;trustServerCertificate=true
spring.datasource.username=hairstudio
spring.datasource.password=YourStrongPassword123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
app.status.disable=Disable

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=U2VjdXJlU3ByaW5nQm9vdEtleUhlcmUxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==
frontend.url=http://localhost:3000

spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=YOUR_EMAIL

stripe.api.key=YOUR_STRIPE_KEY
stripe.webhook.secret=YOUR_STRIPE_SECRET